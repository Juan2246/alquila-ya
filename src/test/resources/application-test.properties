# Perfil de pruebas: base de datos en memoria.
# Permite ejecutar la suite sin un PostgreSQL levantado, en local y en CI.
spring.datasource.url=jdbc:h2:mem:alquilaya_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Los archivos que suban los tests no ensucian el directorio de trabajo
file.upload-dir=target/test-uploads
