spring.application.name=alquilaya

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_alquilaya}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Conserva los datos entre arranques; para despliegues gestionados, usar validate y migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Cada entorno debe aportar su propia clave Base64 de al menos 256 bits.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:10800000}

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
