spring.application.name=alquilaya

spring.datasource.url = jdbc:postgresql://localhost:5432/db_alquilaya
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.show-sql = false

# Firma de los JWT. En cualquier entorno compartido define JWT_SECRET con una
# clave propia en Base64 (256 bits o más); el valor por defecto es solo para local.
jwt.secret = ${JWT_SECRET:QVJRVUlURUNUVVJBX0FQTElDQUNJT05FU19XRUJfVVBDX0lOR0VOSUVSSUFfU0lTVEVNQVNfREVfSU5GT1JNQUNJT04K}
# Vigencia del token: 3 horas
jwt.expiration-ms = ${JWT_EXPIRATION_MS:10800000}

# Configuración de subida de archivos
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
